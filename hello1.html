<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }
        .card {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 {
            margin-bottom: 10px;
        }
        hr {
            margin: 10px 0 20px;
        }
        p {
            font-size: 16px;
            margin: 6px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Student Information</h1>
        <hr>
        <p><strong>Name:</strong> Kumaran</p>
        <p><strong>Register No:</strong> 23MIS0318</p>

        <br>
        <p>Welcome to Python programming!</p>

    </div>

</body>
</html>
